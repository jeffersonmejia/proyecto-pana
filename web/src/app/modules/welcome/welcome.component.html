<main class="welcome-page" aria-labelledby="welcome-title">
  @if (checkingSession()) { <p class="welcome-status">Comprobando sesión…</p> }
  @else { <section class="welcome-card"><img class="welcome-cover" [src]="courseCover()" alt="Portada del curso"><div class="welcome-content"><img class="welcome-logo" src="assets/pana-logo.svg" alt="PANA"><h1 id="welcome-title">Bienvenido al curso de {{ courseName() }}</h1>@if (courseDescription()) { <p>{{ courseDescription() }}</p> } @if (hasSession()) { <p>Estás listo para inscribirte en este curso.</p><button type="button" class="login-action" (click)="enroll()" [disabled]="enrolling()">{{ enrolling() ? 'Inscribiendo…' : 'Inscribirme' }}</button> } @else { <div class="welcome-actions"><button type="button" class="login-action" (click)="goLogin()">¿Ya tienes cuenta? Ingresar</button><button type="button" class="register-action" (click)="goRegistration()">Inscribirme</button></div> } @if (error()) { <p class="welcome-error" role="alert">{{ error() }}</p> }</div></section> }
</main>
