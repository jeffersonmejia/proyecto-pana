<section class="administration" aria-label="Administración">
  <nav class="admin-tabs" role="tablist" aria-label="Secciones de administración">
    @if (canUsers()) { <button type="button" role="tab" [class.active]="active()==='users'" [attr.aria-selected]="active()==='users'" (click)="select('users')"><svg lucideUsersRound [size]="18"></svg>Usuarios ({{ usersCount() }})</button> }
    @if (canPeople()) { <button type="button" role="tab" [class.active]="active()==='people'" [attr.aria-selected]="active()==='people'" (click)="select('people')"><svg lucideUsersRound [size]="18"></svg>Personas</button> }
    @if (canRoles()) { <button type="button" role="tab" [class.active]="active()==='roles'" [attr.aria-selected]="active()==='roles'" (click)="select('roles')"><svg lucideClipboardCheck [size]="18"></svg>Roles y permisos</button> }
    @if (canBackups()) { <button type="button" role="tab" [class.active]="active()==='backups'" [attr.aria-selected]="active()==='backups'" (click)="select('backups')"><svg lucideDownload [size]="18"></svg>Respaldos ({{ backupsCount() }})</button> }
  </nav>
  @if (!sectionReady()) { <section class="admin-skeleton" aria-label="Cargando sección" aria-busy="true"><div class="admin-skeleton-toolbar"><pana-skeleton variant="title" width="230px"></pana-skeleton><pana-skeleton variant="text" width="120px"></pana-skeleton></div><div class="admin-skeleton-table"><pana-skeleton variant="title" width="34%"></pana-skeleton><pana-skeleton variant="text" width="92%"></pana-skeleton><pana-skeleton variant="text" width="86%"></pana-skeleton><pana-skeleton variant="text" width="78%"></pana-skeleton><pana-skeleton variant="text" width="88%"></pana-skeleton></div></section> }
  @else {
    @if (active()==='users'&&canUsers()) { <pana-admin-users /> }
    @if (active()==='people'&&canPeople()) { <pana-people (close)="close.emit()" /> }
    @if (active()==='roles'&&canRoles()) { <pana-admin-roles /> }
    @if (active()==='backups'&&canBackups()) { <pana-backups /> }
  }
</section>
