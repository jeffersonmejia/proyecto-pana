<main class="profile-page"><button class="back-link" type="button" (click)="back()"><svg lucideArrowLeft [size]="18"></svg>Volver a cursos</button><section class="profile-card"><header class="profile-header"><div class="profile-avatar"><svg lucideUserRound [size]="28"></svg></div><div><h1>Mi perfil</h1><p>Administra tus datos personales.</p></div></header>@if (loading()) { <p class="profile-status">Cargando tu perfil...</p> } @else { <form (ngSubmit)="save()"><section class="profile-section"><h2>Datos personales</h2><div class="profile-grid"><label>Nombre<input name="first_name" [(ngModel)]="profile.first_name" required maxlength="120"></label><label>Apellido<input name="last_name" [(ngModel)]="profile.last_name" required maxlength="120"></label><label>Cédula<input name="ci" [(ngModel)]="profile.ci" readonly></label><label>Correo electrónico<input name="email" type="email" [(ngModel)]="profile.email" required maxlength="254"></label><label>Teléfono<input name="phone" [(ngModel)]="profile.phone" maxlength="30"></label><label>Fecha de nacimiento<input name="birth_date" type="date" [(ngModel)]="profile.birth_date"></label><label>Provincia de nacimiento<input name="birth_province" [(ngModel)]="profile.birth_province" maxlength="120"></label><label>Ciudad de nacimiento<input name="birth_city" [(ngModel)]="profile.birth_city" maxlength="120"></label></div></section><section class="profile-section"><h2>Contacto y residencia</h2><div class="profile-grid"><label class="wide">Dirección de domicilio<input name="address" [(ngModel)]="profile.address" maxlength="255"></label><label>Sector o barrio<input name="sector" [(ngModel)]="profile.sector" maxlength="150"></label><label>Instrucción<input name="education" [(ngModel)]="profile.education" maxlength="150"></label></div></section><section class="profile-section"><h2>Información adicional</h2><div class="profile-grid"><label>Género<input name="gender" [(ngModel)]="profile.gender" maxlength="40"></label><label>Autoidentificación<input name="self_identification" [(ngModel)]="profile.self_identification" maxlength="80"></label><label>Discapacidad<input name="has_disability" [(ngModel)]="profile.has_disability" maxlength="10"></label><label>Tipo de discapacidad<input name="disability_type" [(ngModel)]="profile.disability_type" maxlength="100"></label><label class="wide">Observaciones<textarea name="observations" [(ngModel)]="profile.observations" maxlength="5000" rows="4"></textarea></label></div></section>@if (feedback()) { <p class="profile-feedback success" role="status">{{ feedback() }}</p> } @if (error()) { <p class="profile-feedback error" role="alert">{{ error() }}</p> }<footer><button class="save-button" type="submit" [disabled]="saving()"><svg lucideSave [size]="17"></svg>{{ saving() ? 'Guardando...' : 'Guardar cambios' }}</button></footer></form> }</section></main>
