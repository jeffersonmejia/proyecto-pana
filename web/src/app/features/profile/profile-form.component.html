<main class="profile-page">
  <section class="profile-card">
    <header class="profile-header"><div class="profile-avatar"><svg lucideUserRound [size]="28"></svg></div><div><h1>Mi perfil</h1><p>Administra tus datos personales.</p></div></header>
    @if (loading()) { <p class="profile-status">Cargando tu perfil...</p> } @else {
      <form (ngSubmit)="save()">
        <section class="profile-section"><h2>Datos personales</h2><div class="profile-grid">
          <label>Nombre<input name="first_name" [(ngModel)]="profile.first_name" required maxlength="120"></label>
          <label>Apellido<input name="last_name" [(ngModel)]="profile.last_name" required maxlength="120"></label>
          <label>C&eacute;dula<input name="ci" [(ngModel)]="profile.ci" readonly></label>
          <label>Correo electr&oacute;nico<input name="email" type="email" [(ngModel)]="profile.email" [readonly]="emailLocked()" required maxlength="254"></label>
          <label>Tel&eacute;fono<input name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" [(ngModel)]="profile.phone" maxlength="10"></label>
          <label>Fecha de nacimiento<input name="birth_date" type="date" [(ngModel)]="profile.birth_date"></label>
          <label>Provincia de nacimiento<select name="birth_province" [(ngModel)]="profile.birth_province" (ngModelChange)="onProvinceChange()"><option value="">Selecciona una provincia</option>@for (location of locations; track location.name) { <option [value]="location.name">{{ location.name }}</option> }</select></label>
          <label>Ciudad de nacimiento<select name="birth_city" [(ngModel)]="profile.birth_city" [disabled]="!profile.birth_province"><option value="">Selecciona una ciudad</option>@for (city of cities(); track city) { <option [value]="city">{{ city }}</option> }</select></label>
        </div></section>
        <section class="profile-section"><h2>Contacto y residencia</h2><div class="profile-grid">
          <label class="wide">Direcci&oacute;n de domicilio<input name="address" [(ngModel)]="profile.address" maxlength="255"></label>
          <label>Sector o barrio<input name="sector" [(ngModel)]="profile.sector" maxlength="150"></label>
          <label>Instrucci&oacute;n<input name="education" [(ngModel)]="profile.education" maxlength="150"></label>
        </div></section>
        @if (feedback()) { <p class="profile-feedback success" role="status">{{ feedback() }}</p> } @if (error()) { <p class="profile-feedback error" role="alert">{{ error() }}</p> }
        <footer><button class="back-link" type="button" (click)="back()">Volver</button><button class="save-button" type="submit" [disabled]="saving()"><svg lucideSave [size]="17"></svg>{{ saving() ? 'Guardando...' : 'Guardar' }}</button></footer>
      </form>
    }
  </section>
</main>
